:root {
  --paper: #F7F6F2; --card: #FFFFFF; --ink: #26282B; --soft: #6A6E73;
  --line: #E5E3DC; --pine: #175E54; --pine-deep: #0E4139; --signal: #D5442A; --sun: #FFD84D;
  --r: 14px; --shadow: 0 1px 2px rgba(38,40,43,.06), 0 6px 20px rgba(38,40,43,.05);
  --display: "Baloo 2", -apple-system, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pine); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { max-width: 1180px; margin: 0 auto; padding: 0 14px calc(88px + env(safe-area-inset-bottom)); }
.app.wall { font-size: 112%; }
.demobar { background: var(--sun); color: var(--ink); font-size: 13px; font-weight: 600; padding: 7px 14px; margin: 0 -14px; text-align: center; }

/* ── Kopf / Abreißkalender-Masthead ── */
header { padding-top: calc(10px + env(safe-area-inset-top)); }
.mast { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.pagetitle { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.01em; padding: 10px 0 2px; }
.tearoff { position: relative; display: inline-flex; flex-direction: column; padding: 10px 18px 12px; margin-top: 6px;
  background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); cursor: pointer;
  border-top: 6px solid var(--signal); }
.t-wd { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--soft); }
.t-num { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1; margin: 2px 0; }
.t-mon { font-size: 14px; font-weight: 600; color: var(--soft); }
.t-today { position: absolute; top: 10px; right: -10px; background: var(--sun); font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px; transform: rotate(4deg); }
.mastbtns { display: flex; gap: 6px; padding-top: 10px; }
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-size: 20px; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--card); border-radius: 12px; padding: 3px; box-shadow: var(--shadow); }
.seg button { padding: 7px 13px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--soft); }
.seg button.on { background: var(--pine); color: #fff; }
.datenav { display: flex; align-items: center; gap: 6px; }
.todaybtn { padding: 8px 14px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-size: 14px; }

.filterrow { display: flex; gap: 7px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
.filterrow::-webkit-scrollbar { display: none; }
.pchip { --pc: var(--soft); flex: none; padding: 6px 13px; border-radius: 999px; border: 2px solid var(--pc);
  color: var(--pc); font-weight: 700; font-size: 14px; background: var(--card); }
.pchip.on { background: var(--pc); color: #fff; }
.pchip.fam { --pc: var(--ink); }
.swatch { width: 32px; height: 32px; border-radius: 999px; border: 3px solid transparent; }
.swatch.on { border-color: var(--ink); }

main { margin-top: 14px; }
.sec { font-family: var(--display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--soft); margin: 16px 0 8px; display: flex; align-items: center; gap: 7px; }
.empty { color: var(--soft); padding: 10px 2px; }
.empty.small { font-size: 13.5px; padding: 4px 2px; }

/* ── Termin-Chips ── */
.chip { --pc: var(--pine); display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 8px; }
.chip:active { transform: scale(.99); }
.chip-bar { flex: none; width: 5px; align-self: stretch; border-radius: 4px; background: var(--pc); }
.chip-body { flex: 1; min-width: 0; }
.chip-title { display: block; font-weight: 700; font-size: 16px; }
.chip-title .recur { color: var(--soft); font-weight: 400; margin-left: 6px; font-size: 13px; }
.chip-meta { display: block; font-size: 13.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.dense { padding: 8px 10px; }
.chip.dense .chip-title { font-size: 14.5px; }
.chip.dense .chip-meta { font-size: 12.5px; }
.dots { display: inline-flex; flex: none; }
.dots i { border-radius: 999px; border: 2px solid var(--card); margin-left: -4px; }
.dot-familie { color: var(--sun); text-shadow: 0 0 1px var(--ink); font-size: 15px; }
.avatar { display: inline-grid; place-items: center; border-radius: 999px; color: #fff; font-weight: 800; text-transform: uppercase; flex: none; }

/* ── Tagesansicht ── */
.dayview section { margin-bottom: 6px; }

/* ── Agenda (Telefon: Woche / 14 Tage) ── */
.agenda-day { margin-bottom: 14px; }
.agenda-head { display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left; padding: 2px 2px 7px; }
.agenda-head .num { font-family: var(--display); font-weight: 800; font-size: 24px; min-width: 34px; }
.agenda-head .wd { font-weight: 600; color: var(--soft); font-size: 14px; }
.agenda-day.is-today .num { color: var(--signal); }
.agenda-day.is-today .wd { color: var(--signal); font-weight: 800; }
.agenda-empty { color: var(--line); padding-left: 44px; margin-top: -4px; }

/* ── Raster (Woche / 14 Tage / Monat, breite Screens) ── */
.gridweeks { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.grid-head { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--pine); color: #fff; }
.grid-head span { padding: 8px 10px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.grid-row { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); }
.cell { min-height: 108px; padding: 6px 7px; border-left: 1px solid var(--line); cursor: pointer; }
.cell:first-child { border-left: none; }
.cell.dim { background: #FBFAF7; }
.cell.dim .cellnum { color: var(--line); }
.cellnum { font-family: var(--display); font-weight: 700; font-size: 15px; display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 999px; }
.cell.is-today .cellnum { background: var(--signal); color: #fff; }
.mini { --pc: var(--pine); display: block; width: 100%; text-align: left; font-size: 12px; line-height: 1.3; padding: 2px 5px 2px 7px;
  border-left: 3px solid var(--pc); border-radius: 4px; margin-top: 3px; background: color-mix(in srgb, var(--pc) 9%, #fff);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini b { font-weight: 700; }
.more { display: block; font-size: 11.5px; color: var(--soft); margin-top: 3px; }

/* ── Familienansicht ── */
.wallclock { text-align: center; padding: 6px 0 16px; }
.clock { display: block; font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; }
.clockdate { color: var(--soft); font-weight: 600; }
.famgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.famcol { --pc: var(--pine); background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
  border-top: 6px solid var(--pc); padding: 12px 12px 14px; }
.famhead { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
.famname { font-family: var(--display); font-weight: 800; font-size: 20px; }
.famcol h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 12px 0 6px; }
.famcol .chip { box-shadow: none; border: 1px solid var(--line); }

/* ── Aufgaben ── */
.taskgroup { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 14px 12px; margin-bottom: 14px; }
.taskrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.taskrow:last-of-type { border-bottom: none; }
.taskrow input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--pine); flex: none; }
.taskrow.small input[type="checkbox"] { width: 18px; height: 18px; }
.taskrow.done .tasktitle, .taskrow.done span { text-decoration: line-through; color: var(--soft); }
.tasktitle { flex: 1; text-align: left; font-weight: 600; }
.taskrow > span { flex: 1; font-weight: 600; }
.due { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--soft); background: var(--paper); padding: 3px 8px; border-radius: 6px; flex: none; }
.due.late { color: #fff; background: var(--signal); }
.tdot { display: inline-block; width: 12px; height: 12px; border-radius: 999px; flex: none; }
.ghost { color: var(--pine); font-weight: 700; font-size: 14px; padding: 8px 2px; }
.ghost.danger { color: var(--signal); }

/* ── FAB + Bottom-Navigation ── */
.fab { position: fixed; right: 18px; bottom: calc(78px + env(safe-area-inset-bottom)); width: 58px; height: 58px;
  border-radius: 999px; background: var(--pine); color: #fff; font-size: 30px; line-height: 1;
  box-shadow: 0 6px 18px rgba(23,94,84,.4); z-index: 30; }
.fab:active { background: var(--pine-deep); }
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
  background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 25; }
.bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700;
  color: var(--soft); padding: 4px 16px; border-radius: 12px; }
.bottomnav button.on { color: var(--pine); background: color-mix(in srgb, var(--pine) 10%, #fff); }

/* ── Sheets / Modals ── */
.scrim { position: fixed; inset: 0; background: rgba(38,40,43,.44); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px; }
.sheet-head h2 { font-family: var(--display); font-weight: 800; font-size: 21px; flex: 1; }
.x { width: 34px; height: 34px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 15px; flex: none; }
.sheet-body { padding: 6px 18px 18px; overflow-y: auto; }
.sheet-foot { display: flex; gap: 10px; padding: 12px 18px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; flex: 1; }
.f > span { font-size: 13px; font-weight: 700; color: var(--soft); }
.f input, .f select, .f textarea { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); width: 100%; }
.f.check { flex-direction: row; align-items: center; gap: 9px; }
.f.check input { width: 22px; height: 22px; accent-color: var(--pine); }
.f.check span { font-size: 15px; color: var(--ink); font-weight: 600; }
.frow { display: flex; gap: 12px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 7px; }
.primary { background: var(--pine); color: #fff; font-weight: 800; padding: 11px 22px; border-radius: 12px; }
.primary:disabled { opacity: .45; }
.primary.big { width: 100%; padding: 14px; font-size: 17px; }
.danger { color: var(--signal); font-weight: 700; }
.profrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.profname { flex: 1; font-weight: 700; }
.searchinput { flex: 1; border: none; background: var(--card); border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 16px; }
.sheet.search { border-radius: 20px; margin: auto 14px; max-height: 80vh; align-self: center; }

/* ── PIN ── */
.pinscreen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.pincard { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); border-top: 8px solid var(--signal);
  padding: 28px 26px; width: 100%; max-width: 380px; text-align: center; }
.logo { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; margin-bottom: 12px; }
.pincard p { color: var(--soft); font-size: 14.5px; margin-bottom: 16px; }
.pincard input { width: 100%; text-align: center; font-size: 26px; letter-spacing: .3em; border: 1.5px solid var(--line);
  border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.err { color: var(--signal); font-weight: 700; }

/* ── Breit (Tablet quer / Desktop) ── */
@media (min-width: 760px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 20px; margin: 20px; }
  .t-num { font-size: 64px; }
  .cell { min-height: 120px; }
}
/* Wandmodus: alles etwas größer */
.app.wall .chip-title { font-size: 17.5px; }
.app.wall .clock { font-size: 84px; }
.app.wall .cell { min-height: 132px; }
.errraw { color: var(--soft); font-size: 12px; margin-top: -6px; margin-bottom: 10px; word-break: break-word; }
.cfginfo { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--soft); font-size: 12px; line-height: 1.5; }
.cfginfo b { color: var(--ink); word-break: break-all; }
/* ── Wochenenden, Feiertage, Ferien ── */
.grid-head span.wk { opacity: .65; }
.cell.wknd { background: #F0EFE8; }
.cell.wknd .cellnum { color: var(--soft); }
.cell.ferien { background: #FBF3D6; }
.cell.ferien.wknd { background: #F3EBC9; }
.cell.holiday .cellnum { color: var(--signal); font-weight: 800; }
.cell.is-today .cellnum { background: var(--signal); color: #fff; }
.holiname { display: block; font-size: 10.5px; line-height: 1.2; color: var(--signal); font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fpill { display: inline-block; font-size: 10.5px; font-weight: 700; background: var(--sun); color: var(--ink);
  border-radius: 5px; padding: 1px 5px; vertical-align: middle; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cellfer { display: block; margin-top: 1px; width: fit-content; }
.agenda-day.wknd .agenda-head .num, .agenda-day.wknd .agenda-head .wd { color: #A9ADA6; }
.agenda-day.is-today.wknd .agenda-head .num, .agenda-day.is-today.wknd .agenda-head .wd { color: var(--signal); }
.hbadge { font-size: 11px; font-weight: 800; color: var(--signal); background: #FBE4DE; border-radius: 5px; padding: 2px 6px; }
.agenda-head .fpill { margin-left: 2px; }
.daybadges { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 4px; }
.badge { font-size: 13.5px; font-weight: 700; border-radius: 8px; padding: 5px 10px; }
.badge.holiday { background: #FBE4DE; color: var(--signal); }
.badge.ferien { background: var(--sun); color: var(--ink); }

/* ── Erledigt-Ablage ── */
.donebox { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 4px 14px 12px; margin-bottom: 14px; }
.donebox summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--soft);
  padding: 12px 0 8px; list-style: none; }
.donebox summary::-webkit-details-marker { display: none; }
.donebox summary::before { content: "▸ "; }
.donebox[open] summary::before { content: "▾ "; }
/* ── Ich-bin / Wer-trägt-ein ── */
.iconbtn.me { padding: 0; overflow: hidden; }
.iconbtn.me .q { font-weight: 800; color: var(--soft); }
.whogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 6px 0 14px; }
.wholabel { grid-column: 1 / -1; color: var(--soft); font-weight: 600; }
.whobtn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--card);
  border: 2px solid var(--line); border-radius: var(--r); padding: 16px 8px; font-weight: 800; font-size: 16px; }
.whobtn:active { border-color: var(--pc); }
.pin { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: var(--pine);
  background: color-mix(in srgb, var(--pine) 9%, #fff); flex: none; }
.maplink { display: inline-block; color: var(--pine); font-weight: 700; font-size: 14px; margin: -6px 0 12px; }
.createdby { color: var(--soft); font-size: 12.5px; margin-top: 2px; }
/* ── Monatsansicht: kompletter Monat ohne Scrollen ── */
html, body { height: 100%; }
.app.fitmonth { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
.app.fitmonth header { flex: none; }
.app.fitmonth main { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 10px; }
.app.fitmonth .gridweeks { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 6px; }
.app.fitmonth .grid-head { flex: none; }
.app.fitmonth .grid-row { flex: 1; min-height: 0; }
.app.fitmonth .cell { min-height: 0; overflow: hidden; padding: 4px 5px; }
.app.fitmonth .cellnum { min-width: 22px; height: 22px; font-size: 13.5px; }
.app.fitmonth .mini { font-size: 11px; padding: 1px 4px 1px 6px; margin-top: 2px; }
.app.fitmonth .holiname { font-size: 9.5px; }
.app.fitmonth .more { font-size: 10.5px; margin-top: 2px; }
.app.fitmonth .fpill.cellfer { font-size: 9.5px; padding: 0 4px; }
/* Auf sehr kleinen Handy-Displays Filterzeile in der Monatsansicht kompakter */
@media (max-height: 700px) {
  .app.fitmonth .filterrow { padding-top: 8px; }
  .app.fitmonth .tearoff, .app.fitmonth .pagetitle { font-size: 22px; }
}
/* ── ICS-Import ── */
.filebtn { display: inline-block; background: var(--card); border: 2px dashed var(--line); border-radius: 12px;
  padding: 12px 18px; font-weight: 700; color: var(--pine); cursor: pointer; }
.importbox { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
.importbox .primary { margin-top: 8px; }
.importok { color: var(--pine); font-weight: 700; margin-top: 10px; }
/* ── fitcal: alle Kalender-Ansichten füllen die Seite ── */
.app.fitcal { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
.app.fitcal header { flex: none; }
.app.fitcal main { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 10px; }

/* ── Stundenraster ── */
.tgwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.tg-tasks { flex: none; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.tg-task { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border-radius: 10px;
  box-shadow: var(--shadow); padding: 7px 12px; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.tg-task input { width: 18px; height: 18px; accent-color: var(--pine); }
.timegrid { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card);
  border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; position: relative;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.twoweeks { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.twoweeks .timegrid { flex: 1; }
.tg-head { display: grid; background: var(--pine); color: #fff; flex: none; }
.tg-day { padding: 5px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.tg-day.wknd { background: rgba(0,0,0,.14); }
.tg-wd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
.tg-num { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.1; min-width: 24px; border-radius: 999px; }
.tg-day.is-today .tg-num { background: var(--signal); }
.tg-num.holi { color: var(--sun); }
.tg-mark { width: 7px; height: 7px; border-radius: 999px; background: var(--sun); }
.tg-mark.h { background: #FF9B85; }
.tg-day .hbadge { background: rgba(255,255,255,.16); color: #fff; }
.tg-day .fpill { font-size: 10px; }
.tg-allday { display: grid; border-bottom: 1px solid var(--line); flex: none; max-height: 84px; overflow-y: auto; }
.tg-alab { font-size: 10px; color: var(--soft); text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px; }
.tg-acol { padding: 3px 3px 3px 0; min-width: 0; }
.tg-aev { --pc: var(--ink); display: block; width: 100%; text-align: left; font-size: 11.5px; font-weight: 700;
  border-left: 3px solid var(--pc); background: color-mix(in srgb, var(--pc) 10%, #fff); border-radius: 4px;
  padding: 2px 5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg-body { display: grid; flex: 1; min-height: 0; position: relative; }
.tg-times { position: relative; border-right: 1px solid var(--line); }
.tg-times span { position: absolute; right: 6px; transform: translateY(-55%); font-size: 10.5px; font-weight: 700; color: var(--soft); }
.tg-col { position: relative; border-left: 1px solid var(--line); min-width: 0;
  background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-repeat: repeat-y; }
.tg-col:first-of-type { border-left: none; }
.tg-col.wknd { background-color: #F0EFE8; }
.tg-col.ferien { background-color: #FBF3D6; }
.tg-col.ferien.wknd { background-color: #F3EBC9; }
.tg-col.is-today { background-color: #FDF6EC; }
.tg-ev { --pc: var(--pine); position: absolute; box-sizing: border-box; border-radius: 6px; overflow: hidden;
  background: color-mix(in srgb, var(--pc) 14%, #fff); border-left: 4px solid var(--pc);
  padding: 2px 4px; cursor: pointer; touch-action: none; box-shadow: 0 1px 2px rgba(38,40,43,.12); }
.tg-ev-time { display: block; font-size: 10px; font-weight: 800; color: var(--pc); line-height: 1.2; }
.tg-ev-title { display: block; font-size: 11.5px; font-weight: 700; line-height: 1.25; overflow: hidden; }
.tg-ev.lifting { opacity: .45; transform: scale(1.03); box-shadow: 0 8px 20px rgba(38,40,43,.3); z-index: 5; }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--signal); z-index: 4; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -1px; top: -5px; width: 8px; height: 8px; border-radius: 999px; background: var(--signal); }
.dragghost { position: fixed; transform: translate(12px, -34px); background: var(--ink); color: #fff; font-size: 12.5px;
  font-weight: 700; padding: 6px 10px; border-radius: 9px; z-index: 100; pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 20px rgba(38,40,43,.35); }
@media (max-width: 600px) {
  .tg-ev-title { font-size: 9.5px; }
  .tg-ev-time { font-size: 8.5px; }
  .tg-wd { font-size: 9px; }
  .tg-num { font-size: 14px; }
}
.tg-ev { cursor: grab; }
.tg-ev.lifting { cursor: grabbing; }
/* ── Verschiebe-Rückfrage, Toast, Kürzel ── */
.movetitle { font-family: var(--display); font-weight: 800; font-size: 19px; margin-bottom: 10px; }
.moverow { display: flex; gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: 10px; background: var(--card); margin-bottom: 6px; }
.moverow.neu { background: color-mix(in srgb, var(--pine) 10%, #fff); font-weight: 700; }
.movelab { flex: none; width: 52px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
.movewarn { color: var(--signal); font-weight: 700; font-size: 14px; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom));
  background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 12px;
  box-shadow: 0 8px 20px rgba(38,40,43,.35); z-index: 90; animation: up .18s ease-out; max-width: 90vw; }
.keylist { display: flex; flex-direction: column; gap: 2px; }
.keyrow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.keyrow:last-child { border-bottom: none; }
kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px;
  padding: 3px 9px; font-family: var(--body); font-size: 13px; font-weight: 700; min-width: 96px; text-align: center; }
.gridweeks { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.mini { cursor: grab; touch-action: none; }
.mini.lifting { opacity: .45; transform: scale(1.04); box-shadow: 0 6px 16px rgba(38,40,43,.3); cursor: grabbing; }
/* ── Kompakter Kopf ── */
.hrow { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 6px 0 2px; }
.hrow .pagetitle { font-size: 18px; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; cursor: pointer; }
.hspace { flex: 1; }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; }
.iconbtn.me .avatar { width: 26px; height: 26px; }
.seg button { padding: 5px 10px; font-size: 13px; }
.todaybtn { padding: 6px 10px; font-size: 13px; }
.datenav .iconbtn { width: 30px; height: 30px; }
.filterbtn { position: relative; }
.filterbtn.active { background: var(--pine); color: #fff; }
.fdot { position: absolute; top: -4px; right: -4px; background: var(--signal); color: #fff; font-style: normal;
  font-size: 10px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; }
.app.fitcal main { margin-top: 8px; }

/* ── Querformat / niedrige Displays: Chrome radikal einschrumpfen ── */
@media (max-height: 520px) {
  .hrow { padding: 3px 0 0; gap: 5px; }
  .hrow .pagetitle { font-size: 14px; }
  .iconbtn { width: 28px; height: 28px; border-radius: 8px; }
  .seg button { padding: 3px 8px; font-size: 11.5px; }
  .todaybtn { padding: 4px 8px; font-size: 11.5px; }
  .bottomnav { padding: 3px 8px calc(3px + env(safe-area-inset-bottom)); }
  .bottomnav button { padding: 2px 12px; }
  .bottomnav button span { display: none; }
  .fab { width: 44px; height: 44px; font-size: 24px; bottom: calc(52px + env(safe-area-inset-bottom)); right: 12px; }
  .app.fitcal { padding-bottom: calc(42px + env(safe-area-inset-bottom)); }
  .app.fitcal main { margin-top: 5px; }
  .tg-wd { font-size: 8.5px; }
  .tg-num { font-size: 13px; min-width: 20px; }
  .tg-day { padding: 2px 2px; }
  .tg-allday { max-height: 40px; }
  .tg-times span { font-size: 9px; }
  .demobar { font-size: 11px; padding: 3px 10px; }
  .cellnum { min-width: 19px; height: 19px; font-size: 12px; }
  .app.fitmonth .mini { font-size: 9.5px; }
}

/* ── Listen ── */
.listbar { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.listbar::-webkit-scrollbar { display: none; }
.pchip.newlist { border-style: dashed; color: var(--soft); --pc: var(--soft); }
.listtools { display: flex; gap: 14px; padding: 0 2px 8px; }

/* ── Aufgaben im Kalender ── */
.mini.task { border-left-style: dashed; background: #fff; color: var(--soft); font-weight: 600; --pc: var(--soft); }
.tg-aev.task { border-left-style: dashed; background: #fff; color: var(--soft); --pc: var(--soft); }

/* ── Wochenüberblick & Zuweisung ── */
.famtop { display: flex; justify-content: flex-end; padding-bottom: 8px; }
.reviewbtn { background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.issuebox { background: #FBE4DE; border-radius: 12px; padding: 4px 12px 10px; margin-bottom: 6px; }
.issuebox .sec { color: var(--signal); }
.issue { font-size: 14px; padding: 4px 0; border-bottom: 1px dashed rgba(213,68,42,.25); }
.issue:last-of-type { border-bottom: none; }
.revday { padding: 6px 0 2px; border-bottom: 1px solid var(--line); }
.revhead { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.revhead b { font-family: var(--display); font-size: 15px; }
.revwd { color: var(--soft); font-size: 12.5px; }
.revempty { color: var(--line); padding: 0 0 4px 2px; }
.revitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 3px 2px; font-size: 14px; }
.revitem span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.revitem.task { color: var(--soft); font-weight: 600; }
.assignitem { background: var(--card); border-left: 5px solid var(--sun); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; line-height: 1.5; }
.assignby { color: var(--soft); font-size: 13px; }
/* ── Kalenderwochen ── */
.kwcorner { display: grid; place-items: center; font-size: 10px; font-weight: 800; opacity: .85; letter-spacing: .02em; }
.grid-head { grid-template-columns: 30px repeat(7, 1fr); }
.grid-row { grid-template-columns: 30px repeat(7, 1fr); }
.kwhead { padding: 8px 2px !important; font-size: 10px !important; text-align: center; }
.kwcell { display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--soft);
  background: #F3F2EC; border-right: 1px solid var(--line); }
.app.fitmonth .grid-head, .app.fitmonth .grid-row { grid-template-columns: 24px repeat(7, 1fr); }
.app.fitmonth .kwcell { font-size: 10px; }
/* ── Überlappende Termine: sichtbare Trennung + Stapel ── */
.tg-ev { border: 1px solid rgba(255,255,255,.95); }
.ghost.strong { border: 2px solid var(--pine); border-radius: 12px; padding: 9px 14px; }
.primary.del { background: var(--signal); }
/* ── Aufgabe/Liste-Auswahl + Zuweisungs-Chip ── */
.choicebtn { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: var(--card);
  border: 2px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; }
.choicebtn b { font-family: var(--display); font-size: 17px; }
.choicebtn span { color: var(--soft); font-size: 13.5px; }
.choicebtn:active { border-color: var(--pine); }
.assignee { --pc: var(--soft); flex: none; font-size: 12px; font-weight: 700; color: var(--pc);
  border: 1.5px solid var(--pc); border-radius: 999px; padding: 2px 8px; }

</style>
