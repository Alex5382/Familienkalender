:root {
  --paper: #F7F6F2; --card: #FFFFFF; --ink: #26282B; --soft: #6A6E73; --line: #E4E1D8;
  --pine: #175E54; --signal: #D5442A; --sun: #FFD84D;
  --r: 16px; --shadow: 0 1px 3px rgba(38, 40, 43, .08), 0 4px 14px rgba(38, 40, 43, .06);
  --display: "Baloo 2", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }

.app { max-width: 1080px; margin: 0 auto; padding: 0 14px calc(76px + env(safe-area-inset-bottom)); }
.app.fitcal, .app.fitmonth { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
.app.fitcal main, .app.fitmonth main { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 8px; }
.app.wall { font-size: 18px; }

/* ── Kopf ── */
.hrow { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 6px 0 2px; }
.pagetitle { font-family: var(--display); font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; cursor: pointer; }
.hspace { flex: 1; }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); }
.iconbtn.me .q { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--soft); }
.iconbtn.me .avatar { width: 26px; height: 26px; }
.filterbtn { position: relative; }
.filterbtn.active { background: var(--pine); color: #fff; }
.fdot { position: absolute; top: -4px; right: -4px; background: var(--signal); color: #fff; font-style: normal; font-size: 10px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; }
.seg { display: flex; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 3px; gap: 2px; }
.seg button { padding: 5px 10px; font-size: 13px; font-weight: 700; border-radius: 9px; color: var(--soft); }
.seg button.on { background: var(--pine); color: #fff; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav .iconbtn { width: 30px; height: 30px; font-size: 17px; font-weight: 800; }
.todaybtn { padding: 6px 10px; font-size: 13px; font-weight: 700; background: var(--card); border-radius: 10px; box-shadow: var(--shadow); }
.avatar { border-radius: 50%; color: #fff; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 800; text-transform: uppercase; flex: none; }

/* ── Chips (Familienansicht/Suche) ── */
.chip { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 9px 12px; margin-bottom: 8px; cursor: pointer; }
.chip-bar { width: 5px; align-self: stretch; border-radius: 4px; background: var(--pc); flex: none; }
.chip-body { min-width: 0; flex: 1; }
.chip-title { display: block; font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-meta { display: block; color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.dense { padding: 7px 10px; }
.chip.dense .chip-title { font-size: 14px; }
.chip.dense .chip-meta { font-size: 12px; }
.recur { margin-left: 5px; color: var(--soft); font-weight: 800; }
.dots { display: inline-flex; gap: 3px; flex: none; }
.dots i { border-radius: 50%; display: inline-block; }
.dot-familie { color: var(--sun); text-shadow: 0 0 1px rgba(0,0,0,.35); flex: none; }
.pin { color: var(--pine); flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; }
.pin:active { background: rgba(23,94,84,.1); }
.maplink { display: inline-block; color: var(--pine); font-weight: 700; font-size: 14px; margin: -4px 0 10px; text-decoration: none; }

/* ── Stundenraster ── */
.tgwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.timegrid { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.twoweeks { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.twoweeks .timegrid { flex: 1; }
.tg-head { display: grid; background: var(--pine); color: #fff; }
.kwcorner { display: grid; place-items: center; font-size: 10px; font-weight: 800; opacity: .85; letter-spacing: .02em; }
.tg-day { display: flex; flex-direction: column; align-items: center; padding: 4px 2px 5px; gap: 1px; position: relative; }
.tg-day.wknd { background: rgba(0,0,0,.12); }
.tg-day.is-today { background: rgba(255,216,77,.25); }
.tg-wd { font-size: 9.5px; font-weight: 700; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
.tg-num { font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1.1; min-width: 24px; text-align: center; border-radius: 8px; }
.tg-day.is-today .tg-num { background: var(--sun); color: var(--ink); }
.tg-num.holi { color: var(--sun); }
.tg-mark { position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: #7fd4c4; }
.tg-mark.h { background: var(--sun); }
.tg-day .hbadge, .tg-day .fpill { margin-top: 2px; }
.tg-allday { display: grid; border-bottom: 1px solid var(--line); background: #FBFAF6; max-height: 84px; overflow-y: auto; }
.tg-alab { font-size: 9px; color: var(--soft); text-transform: uppercase; letter-spacing: .05em; display: grid; place-items: center; }
.tg-acol { padding: 3px 2px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tg-aev { --pc: var(--ink); text-align: left; font-size: 11.5px; font-weight: 700; background: color-mix(in srgb, var(--pc) 14%, #fff); border-left: 3px solid var(--pc); border-radius: 6px; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg-aev.task { border-left-style: dashed; background: #fff; color: var(--soft); --pc: var(--soft); }
.tg-body { position: relative; display: grid; flex: 1; min-height: 0; }
.tg-times { position: relative; border-right: 1px solid var(--line); }
.tg-times span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 10.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.tg-col { position: relative; border-right: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); }
.tg-col:last-child { border-right: none; }
.tg-col.wknd { background-color: #F3F2EC; }
.tg-col.ferien { background-color: #EEF5F1; }
.tg-col.is-today { background-color: rgba(255,216,77,.07); }
.tg-ev { --pc: var(--ink); position: absolute; border-radius: 8px; background: color-mix(in srgb, var(--pc) 16%, #fff); border-left: 4px solid var(--pc); border-top: 1px solid rgba(255,255,255,.95); border-right: 1px solid rgba(255,255,255,.95); border-bottom: 1px solid rgba(255,255,255,.95); padding: 2px 4px; overflow: hidden; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
.tg-ev.lifting { opacity: .45; }
.tg-ev-time { display: block; font-size: 9px; font-weight: 800; color: var(--pc); line-height: 1.2; }
.tg-ev-title { display: block; font-size: 11px; font-weight: 700; line-height: 1.25; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--signal); z-index: 5; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -1px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); }
.tg-tasks { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px 12px; }
.tg-tasks h4 { font-family: var(--display); font-size: 13px; color: var(--soft); margin-bottom: 4px; }
.dragghost { position: fixed; transform: translate(-50%, -130%); background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; pointer-events: none; z-index: 200; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

/* ── Monat ── */
.gridweeks { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.grid-head { display: grid; grid-template-columns: 30px repeat(7, 1fr); background: var(--pine); color: #fff; }
.grid-head span { padding: 8px 6px; font-size: 12px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.grid-head span.wk { opacity: .75; }
.kwhead { padding: 8px 2px !important; font-size: 10px !important; }
.grid-row { display: grid; grid-template-columns: 30px repeat(7, 1fr); flex: 1; min-height: 0; }
.kwcell { display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--soft); background: #F3F2EC; border-right: 1px solid var(--line); border-top: 1px solid var(--line); }
.cell { border-top: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px; min-height: 0; overflow: hidden; cursor: pointer; position: relative; display: flex; flex-direction: column; }
.cell:last-child { border-right: none; }
.cell.dim { background: #FBFAF6; }
.cell.dim .cellnum { color: #B9B6AC; }
.cell.wknd { background: #F3F2EC; }
.cell.ferien { background: #EEF5F1; }
.cell.holiday { background: #FDF6E0; }
.cell.is-today .cellnum { background: var(--sun); }
.cellnum { font-family: var(--display); font-weight: 800; font-size: 13px; min-width: 21px; height: 21px; display: inline-grid; place-items: center; border-radius: 8px; flex: none; align-self: flex-start; }
.holiname { font-size: 9px; color: #A07900; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cellfer { align-self: flex-start; }
.cellev { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; min-height: 0; overflow: hidden; }
.mini { --pc: var(--ink); text-align: left; font-size: 10.5px; line-height: 1.3; background: color-mix(in srgb, var(--pc) 13%, #fff); border-left: 3px solid var(--pc); border-radius: 5px; padding: 1px 4px 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; touch-action: none; user-select: none; -webkit-user-select: none; }
.mini b { font-weight: 800; font-size: 9.5px; color: var(--pc); }
.mini.lifting { opacity: .45; }
.mini.task { border-left-style: dashed; background: #fff; color: var(--soft); font-weight: 600; --pc: var(--soft); }
.more { font-size: 9.5px; color: var(--soft); }
.hbadge { background: var(--sun); color: var(--ink); font-size: 10px; font-weight: 800; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.fpill { background: #DDEDE6; color: var(--pine); font-size: 10px; font-weight: 800; border-radius: 999px; padding: 1px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* ── Familienansicht ── */
.famtop { display: flex; justify-content: flex-end; padding-bottom: 8px; }
.reviewbtn { background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.wallclock { text-align: center; padding: 4px 0 14px; }
.clock { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; display: block; }
.clockdate { color: var(--soft); font-size: 16px; }
.famgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.famcol { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); border-top: 5px solid var(--pc); padding: 12px; }
.famhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.famname { font-family: var(--display); font-weight: 800; font-size: 19px; }
.famcol h4 { font-family: var(--display); font-size: 13px; color: var(--soft); margin: 10px 0 5px; text-transform: uppercase; letter-spacing: .03em; }

/* ── Aufgaben & Listen ── */
.tasksview { padding-top: 4px; }
.listbar { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.listbar::-webkit-scrollbar { display: none; }
.pchip.newlist { border-style: dashed; color: var(--soft); --pc: var(--soft); }
.listtools { display: flex; gap: 14px; padding: 0 2px 8px; }
.taskgroup { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 14px 12px; margin-bottom: 12px; border-left: 5px solid var(--pc); }
.sec { font-family: var(--display); font-size: 15px; margin: 6px 0; display: flex; align-items: center; gap: 7px; }
.tdot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex: none; }
.taskrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.taskrow:last-of-type { border-bottom: none; }
.taskrow input[type="checkbox"] { width: 21px; height: 21px; accent-color: var(--pine); flex: none; }
.taskrow.small { padding: 5px 0; font-size: 14px; }
.taskrow.small input { width: 18px; height: 18px; }
.taskrow.done span { text-decoration: line-through; color: var(--soft); }
.tasktitle { text-align: left; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.taskrow > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.assignee { --pc: var(--soft); flex: none; font-size: 12px; font-weight: 700; color: var(--pc); border: 1.5px solid var(--pc); border-radius: 999px; padding: 2px 8px; }
.due { flex: none; font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--pine); background: #DDEDE6; border-radius: 999px; padding: 2px 9px; }
.due.late { color: #fff; background: var(--signal); }
.donebox { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 14px; margin-bottom: 12px; }
.donebox summary { font-weight: 700; color: var(--soft); cursor: pointer; }
.choicebtn { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; }
.choicebtn b { font-family: var(--display); font-size: 17px; }
.choicebtn span { color: var(--soft); font-size: 13.5px; }
.choicebtn:active { border-color: var(--pine); }

/* ── Buttons, Formulare, Sheets ── */
.ghost { color: var(--pine); font-weight: 700; padding: 7px 2px; font-size: 14px; }
.ghost.danger { color: var(--signal); }
.ghost.strong { border: 2px solid var(--pine); border-radius: 12px; padding: 9px 14px; }
.danger { color: var(--signal); font-weight: 700; padding: 10px 6px; }
.primary { background: var(--pine); color: #fff; font-weight: 800; border-radius: 12px; padding: 10px 18px; }
.primary:disabled { opacity: .45; }
.primary.big { width: 100%; padding: 14px; font-size: 17px; }
.primary.del { background: var(--signal); }
.scrim { position: fixed; inset: 0; background: rgba(38,40,43,.4); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 640px; max-height: 92dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 22px; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px; }
.sheet-head h2 { font-family: var(--display); font-weight: 800; font-size: 21px; flex: 1; }
.x { width: 34px; height: 34px; border-radius: 10px; background: var(--card); box-shadow: var(--shadow); font-size: 15px; flex: none; }
.sheet-body { padding: 6px 18px 14px; overflow-y: auto; }
.sheet-foot { display: flex; align-items: center; gap: 10px; padding: 10px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.f { display: block; margin-bottom: 12px; }
.f > span { display: block; font-size: 13px; font-weight: 700; color: var(--soft); margin-bottom: 4px; }
.f input, .f select, .f textarea { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.f input:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--pine); border-color: var(--pine); }
.f.check { display: flex; align-items: center; gap: 9px; }
.f.check input { width: 22px; height: 22px; accent-color: var(--pine); flex: none; }
.f.check span { margin: 0; font-size: 15px; color: var(--ink); font-weight: 600; }
.frow { display: flex; gap: 12px; }
.frow .f { flex: 1; }
.chiprow { display: flex; flex-wrap: wrap; gap: 7px; }
.pchip { --pc: var(--soft); border: 2px solid var(--pc); color: var(--pc); border-radius: 999px; padding: 6px 13px; font-weight: 700; font-size: 14px; background: #fff; flex: none; }
.pchip.on { background: var(--pc); color: #fff; }
.pchip.fam { --pc: var(--ink); }
.createdby { color: var(--soft); font-size: 13px; margin-top: -2px; }
.movetitle { font-weight: 700; margin-bottom: 8px; }
.moverow { display: flex; gap: 10px; margin-bottom: 6px; }
.moverow b { min-width: 62px; display: inline-block; }
.movewarn { background: #FBE4DE; color: var(--signal); font-weight: 700; border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: 14px; }
.profrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.profname { flex: 1; font-weight: 700; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; flex: none; }
.swatch.on { border-color: var(--ink); }
.empty { color: var(--soft); padding: 8px 0; }
.empty.small { font-size: 13px; padding: 4px 0; }
.filebtn { display: inline-block; background: var(--card); border: 2px dashed var(--pine); color: var(--pine); font-weight: 700; border-radius: 12px; padding: 10px 16px; cursor: pointer; margin-bottom: 8px; }
.importbox { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; margin-top: 8px; }
.importbox p { margin-bottom: 8px; }
.importok { color: var(--pine); font-weight: 700; margin-top: 8px; }
.searchinput { flex: 1; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 16px; }
.keylist { list-style: none; }
.keylist li { display: flex; gap: 12px; padding: 5px 0; align-items: center; }
.kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 7px; padding: 2px 9px; font-family: monospace; font-weight: 700; min-width: 40px; text-align: center; }

/* ── Wochenüberblick, Zuweisung, Erinnerung ── */
.issuebox { background: #FBE4DE; border-radius: 12px; padding: 4px 12px 10px; margin-bottom: 6px; }
.issuebox .sec { color: var(--signal); }
.issue { font-size: 14px; padding: 4px 0; border-bottom: 1px dashed rgba(213,68,42,.25); }
.issue:last-of-type { border-bottom: none; }
.revday { padding: 6px 0 2px; border-bottom: 1px solid var(--line); }
.revhead { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
.revhead b { font-family: var(--display); font-size: 15px; }
.revwd { color: var(--soft); font-size: 12.5px; }
.revempty { color: var(--line); padding: 0 0 4px 2px; }
.revitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 3px 2px; font-size: 14px; }
.revitem span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.revitem.task { color: var(--soft); font-weight: 600; }
.assignitem { background: var(--card); border-left: 5px solid var(--sun); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; line-height: 1.5; }
.assignby { color: var(--soft); font-size: 13px; }
.rembanner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 300; width: min(94vw, 480px); background: var(--ink); color: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 14px 16px; animation: up .2s ease-out; }
.rembanner h4 { font-family: var(--display); font-size: 16px; margin-bottom: 4px; }
.rembanner p { font-size: 14.5px; opacity: .92; margin-bottom: 4px; }
.rembanner .rembtns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.rembanner button { background: var(--sun); color: var(--ink); font-weight: 800; border-radius: 10px; padding: 7px 16px; }
.pushbox { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; }
.pushbox p { font-size: 13.5px; color: var(--soft); margin-bottom: 8px; }
.pushstatus { font-weight: 700; color: var(--pine); margin-bottom: 8px; display: block; }
.pushstatus.off { color: var(--soft); }

/* ── PIN, Demo, Toast, Nav, FAB ── */
.pinscreen { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
.pincard { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 28px 24px; width: 100%; max-width: 380px; text-align: center; }
.logo { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; color: var(--pine); margin-bottom: 12px; }
.pincard p { color: var(--soft); font-size: 14.5px; margin-bottom: 14px; }
.pincard input { width: 100%; text-align: center; font-size: 26px; letter-spacing: .35em; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.pincard .err { color: var(--signal); font-weight: 700; font-size: 14px; }
.errraw { color: var(--soft); font-size: 12px; margin-top: -6px; }
.cfginfo { font-size: 12px; color: var(--soft); word-break: break-all; }
.demobar { background: var(--sun); text-align: center; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 0 0 12px 12px; margin: 0 -14px; }
.toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; z-index: 250; box-shadow: 0 6px 18px rgba(0,0,0,.3); max-width: 92vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 8vw; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); z-index: 50; }
.bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; font-weight: 700; color: var(--soft); padding: 3px 14px; border-radius: 12px; }
.bottomnav button.on { color: var(--pine); background: #DDEDE6; }
.fab { position: fixed; right: 18px; bottom: calc(66px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; background: var(--signal); color: #fff; font-size: 30px; font-weight: 800; box-shadow: 0 6px 18px rgba(213,68,42,.45); z-index: 60; display: grid; place-items: center; line-height: 1; }
.whogrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; padding: 6px 0 14px; }
.wholabel { grid-column: 1 / -1; color: var(--soft); font-weight: 700; }
.whobtn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--card); border: 2.5px solid var(--pc); border-radius: var(--r); padding: 16px 8px; font-weight: 800; font-family: var(--display); font-size: 17px; }

/* ── Querformat / niedrige Displays ── */
@media (max-height: 520px) {
  .hrow { padding: 3px 0 0; gap: 5px; }
  .pagetitle { font-size: 14px; }
  .iconbtn { width: 28px; height: 28px; border-radius: 8px; }
  .seg button { padding: 3px 8px; font-size: 11.5px; }
  .todaybtn { padding: 4px 8px; font-size: 11.5px; }
  .bottomnav { padding: 3px 8px calc(3px + env(safe-area-inset-bottom)); }
  .bottomnav button { padding: 2px 12px; }
  .bottomnav button span { display: none; }
  .fab { width: 44px; height: 44px; font-size: 24px; bottom: calc(52px + env(safe-area-inset-bottom)); right: 12px; }
  .app.fitcal, .app.fitmonth { padding-bottom: calc(42px + env(safe-area-inset-bottom)); }
  .app.fitcal main, .app.fitmonth main { margin-top: 5px; }
  .tg-wd { font-size: 8.5px; }
  .tg-num { font-size: 13px; min-width: 20px; }
  .tg-day { padding: 2px 2px; }
  .tg-allday { max-height: 40px; }
  .tg-times span { font-size: 9px; }
  .demobar { font-size: 11px; padding: 3px 10px; }
  .cellnum { min-width: 19px; height: 19px; font-size: 12px; }
  .app.fitmonth .mini { font-size: 9.5px; }
}

/* ── Smartphone hochkant: größere Darstellung ── */
@media (max-width: 480px) and (min-height: 521px) {
  body { font-size: 17px; }
  .pagetitle { font-size: 20px; max-width: 52vw; }
  .iconbtn { width: 38px; height: 38px; }
  .datenav .iconbtn { width: 34px; height: 34px; }
  .seg button { padding: 7px 12px; font-size: 14.5px; }
  .todaybtn { padding: 8px 12px; font-size: 14.5px; }
  .tg-ev-title { font-size: 12px; }
  .tg-ev-time { font-size: 10px; }
  .tg-wd { font-size: 10.5px; }
  .tg-num { font-size: 16px; min-width: 26px; }
  .tg-times span { font-size: 11.5px; }
  .tg-aev { font-size: 12.5px; }
  .kwcorner { font-size: 11px; }
  .cellnum { min-width: 24px; height: 24px; font-size: 14.5px; }
  .app.fitmonth .mini { font-size: 11px; padding: 2px 5px 2px 7px; }
  .kwcell { font-size: 11.5px; }
  .chip-title { font-size: 17px; }
  .chip-meta { font-size: 14px; }
  .taskrow { padding: 11px 0; }
  .taskrow input[type="checkbox"] { width: 24px; height: 24px; }
  .tasktitle, .taskrow > span { font-size: 16.5px; }
  .pchip { padding: 8px 15px; font-size: 15px; }
  .bottomnav button { font-size: 12.5px; padding: 5px 16px; }
  .fab { width: 62px; height: 62px; font-size: 32px; }
  .famname { font-size: 22px; }
  .f input, .f select, .f textarea { padding: 12px 13px; font-size: 16.5px; }
  .sheet-head h2 { font-size: 23px; }
  .revitem { font-size: 15px; }
}
/* ── Adresse & Fahrzeit ── */
.locrow { display: flex; gap: 8px; }
.locrow input { flex: 1; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.locrow input:focus { outline: 2px solid var(--pine); border-color: var(--pine); }
.checkbtn { flex: none; background: var(--card); border: 2px solid var(--pine); color: var(--pine); font-weight: 800; border-radius: 12px; padding: 0 16px; }
.checkbtn:disabled { opacity: .4; }
.geosug { display: block; width: 100%; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; margin: 0 0 6px; font-size: 14.5px; font-weight: 600; }
.geosug:active { border-color: var(--pine); }
.routeline { color: var(--pine); font-weight: 700; font-size: 14px; margin: 2px 0 10px; }
.routeline .ghost { padding: 0 4px; }
/* ── Monat im Google-Stil: vollflächige Farbbalken ── */
.mini { background: var(--pc); color: var(--tc, #fff); border-left: none; border-radius: 4px; padding: 2px 6px; font-weight: 700; }
.mini b { color: inherit; opacity: .85; font-weight: 800; }
.mini.task { background: #fff; color: var(--soft); border: 1.5px dashed var(--soft); font-weight: 600; }
.more { color: var(--soft); font-weight: 800; letter-spacing: 2px; line-height: .8; padding-left: 2px; }
.cell { padding: 3px 3px 2px; }
.cellev { gap: 2.5px; }
.cellnum { font-size: 14px; min-width: 23px; height: 23px; }
.cell.is-today .cellnum { background: var(--pine); color: #fff; border-radius: 50%; }
@media (max-width: 480px) and (min-height: 521px) {
  .app.fitmonth .cellnum { min-width: 27px; height: 27px; font-size: 16.5px; }
  .app.fitmonth .mini { font-size: 11.5px; padding: 2.5px 5px; border-radius: 4px; }
  .app.fitmonth .mini b { display: none; }
  .app.fitmonth .grid-head span { font-size: 12.5px; padding: 7px 2px; }
  .app.fitmonth .kwcell { font-size: 12px; }
}
/* ── Ferien-/Feiertagsbalken, Geburtstage, Freie Tage, Monatssprung ── */
.daybar { display: block; font-size: 9.5px; font-weight: 800; border-radius: 4px; padding: 1px 5px; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daybar.holi { background: var(--sun); color: var(--ink); }
.daybar.fer { background: #CBE3D6; color: var(--pine); }
.daybar.fer.slim { height: 6px; padding: 0; }
.mini.bday { background: #FFF0C7; color: #8A6400; border: none; }
.tg-aev.bday { background: #FFF0C7; color: #8A6400; border-left-color: var(--sun); }
.bdayico { font-size: 22px; flex: none; }
.bdaymeta { color: var(--soft); font-size: 12.5px; font-weight: 400; }
.freeok { color: var(--pine); font-weight: 800; }
.yearrow { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 4px 0 12px; }
.yearlabel { font-family: var(--display); font-size: 26px; }
.monthgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-bottom: 8px; }
.monthbtn { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 4px; font-weight: 800; font-family: var(--display); font-size: 16px; }
.monthbtn.on { border-color: var(--pine); background: #DDEDE6; color: var(--pine); }
@media (max-width: 480px) and (min-height: 521px) {
  .app.fitmonth .daybar { font-size: 9px; }
  .famtop { flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
}
/* ── Feiertage/Ferien deutlich einfärben ── */
.cell.ferien { background: #D9EBE1; }
.cell.holiday { background: #FFE7A3; }
.cell.holiday .cellnum { color: #A34A00; }
.cell.holiday.wknd, .cell.wknd.holiday { background: #FFDF8C; }
.tg-col.ferien { background-color: #DFEEE5; }
.tg-col.holi { background-color: #FFE7A3; }
.tg-col.holi.wknd { background-color: #FFDF8C; }
.tg-day.holiday { background: rgba(255, 216, 77, .5); }
.tg-day.holiday .tg-num { color: #fff; }
.daybar.fer { background: #BBDCCB; }
/* ── Einkaufs-Warnung im Wochenüberblick ── */
.shopbox { background: #FFF0C7; border-radius: 12px; padding: 4px 12px 10px; margin-bottom: 8px; }
.shopbox .sec { color: #8A6400; }
.shopbox .issue { border-bottom-color: rgba(160, 121, 0, .25); }

</style>
